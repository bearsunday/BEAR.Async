name: Continuous Integration

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  phpunit:
    name: PHPUnit
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version:
          - '8.2'
          - '8.3'
          - '8.4'
          - '8.5'
        dependencies:
          - lowest
          - highest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: pcov
          ini-values: zend.assertions=1

      - name: Install dependencies
        uses: ramsey/composer-install@v3
        with:
          dependency-versions: ${{ matrix.dependencies }}

      - name: Run PHPUnit
        run: ./vendor/bin/phpunit --coverage-text

  phpunit-parallel:
    name: PHPUnit (Parallel)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP with ZTS and ext-parallel
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: parallel
          coverage: none
          ini-values: zend.assertions=1
        env:
          phpts: zts

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Run PHPUnit (parallel group)
        run: ./vendor/bin/phpunit --group parallel
