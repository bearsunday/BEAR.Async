name: Async Benchmark

on:
  push:
  pull_request:

jobs:
  benchmark-docker:
    name: Docker Benchmark (parallel + swoole)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker-compose build php

      - name: Start MySQL
        run: docker-compose up -d mysql

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            if docker-compose exec -T mysql mysqladmin ping -h localhost -uroot 2>/dev/null; then
              echo "MySQL is ready"
              break
            fi
            echo "Waiting for MySQL... ($i/30)"
            sleep 2
          done

      - name: Install demo dependencies
        run: docker-compose run --rm php composer install --working-dir=/app/demo --prefer-dist --no-interaction

      - name: Run ext-parallel benchmark
        run: |
          result=$(docker-compose run --rm php php demo/bin/parallel-benchmark.php 3)
          echo "$result"
          echo "$result" | grep -q "SUCCESS" || exit 1

      - name: Run ext-swoole benchmark
        run: |
          result=$(docker-compose run --rm php php demo/bin/swoole-benchmark.php 3)
          echo "$result"
          # Swoole benchmark doesn't require specific speedup threshold

      - name: Cleanup
        if: always()
        run: docker-compose down -v
