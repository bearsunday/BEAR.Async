# Async Benchmark with pre-built Docker image caching
#
# This workflow caches the Docker image in ghcr.io to avoid rebuilding
# PHP extensions (parallel, swoole) on every run.
#
# AWS CodeBuild + ECR equivalent:
#   phases:
#     pre_build:
#       commands:
#         - aws ecr get-login-password | docker login --username AWS --password-stdin $ECR_REGISTRY
#         - docker pull $ECR_REGISTRY/bear-async-php:latest || true
#     build:
#       commands:
#         - |
#           if [ -z "$(docker images -q $ECR_REGISTRY/bear-async-php:latest)" ]; then
#             docker build -t $ECR_REGISTRY/bear-async-php:latest .
#             docker push $ECR_REGISTRY/bear-async-php:latest
#           fi

name: Async Benchmark

on:
  push:
  pull_request:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/bear-async-php

jobs:
  benchmark-docker:
    name: Docker Benchmark (parallel + swoole)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if image exists
        id: check-image
        run: |
          if docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest 2>/dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        if: steps.check-image.outputs.exists == 'false'
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        if: steps.check-image.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Start MySQL
        run: docker compose up -d mysql

      - name: Wait for MySQL
        run: |
          ready=false
          for i in {1..30}; do
            if docker compose exec -T mysql mysqladmin ping -h localhost -uroot 2>/dev/null; then
              echo "MySQL is ready"
              ready=true
              break
            fi
            echo "Waiting for MySQL... ($i/30)"
            sleep 2
          done
          if [ "$ready" != "true" ]; then
            echo "MySQL failed to become ready"
            exit 1
          fi

      - name: Install main dependencies
        run: docker compose run --rm php composer install --prefer-dist --no-interaction

      - name: Install demo dependencies
        run: docker compose run --rm php composer install --working-dir=/app/demo --prefer-dist --no-interaction --no-scripts

      - name: Verify environment
        run: |
          echo "PHP Extensions:"
          docker compose run --rm php php -m | grep -E "parallel|swoole|pdo" || true
          echo "Environment:"
          docker compose run --rm php php -r "echo 'DB_DSN: ' . getenv('DB_DSN') . PHP_EOL;"
          echo "Test DB connection:"
          docker compose run --rm php php -r "new PDO(getenv('DB_DSN'), getenv('DB_USER'), getenv('DB_PASS')); echo 'OK';"

      - name: Run ext-parallel benchmark
        run: docker compose run --rm php php demo/bin/parallel-benchmark.php 3

      - name: Run ext-swoole benchmark
        run: |
          result=$(docker compose run --rm php php demo/bin/swoole-benchmark.php 3)
          echo "$result"
          # Swoole benchmark doesn't require specific speedup threshold

      - name: Cleanup
        if: always()
        run: docker compose down -v
