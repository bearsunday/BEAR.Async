services:
  php:
    image: ghcr.io/bearsunday/bear-async-php:latest
    build: .
    # The pre-built benchmark image can carry a Composer older than 2.2.7, whose
    # github-oauth validation rejects GitHub Actions "ghs_" tokens (underscore /
    # uppercase) with "contains invalid characters", breaking `composer install`
    # once COMPOSER_AUTH is passed in. Self-update Composer before running any
    # `composer` command -- with COMPOSER_AUTH unset for the self-update itself so
    # the stale binary can't reject the token before it upgrades. All other
    # commands pass straight through to the image's default entrypoint.
    # ($$ escapes $ so Compose forwards a literal $1/$@ to the container shell.)
    entrypoint:
      - sh
      - -c
      - 'if [ "$$1" = composer ]; then env -u COMPOSER_AUTH composer self-update --2; fi; exec docker-php-entrypoint "$$@"'
      - --
    volumes:
      - .:/app
    working_dir: /app
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - DB_DSN=mysql:host=mysql;dbname=bear_async_demo
      - DB_USER=root
      - DB_PASS=
      - COMPOSER_AUTH
      - GIT_CONFIG_COUNT=1
      - GIT_CONFIG_KEY_0=safe.directory
      - GIT_CONFIG_VALUE_0=/app

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: bear_async_demo
    volumes:
      - ./demo/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./demo/sql/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot"]
      interval: 5s
      timeout: 5s
      retries: 10
