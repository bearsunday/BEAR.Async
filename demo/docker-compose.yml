x-db-env: &db-env
  DB_DSN: "mysql:host=mysql;dbname=demo"
  DB_USER: "demo"
  DB_PASS: "demo"

services:
  parallel:
    build:
      context: .
      target: parallel
    volumes:
      - ..:/workspace
    working_dir: /workspace/demo
    command: ["sleep", "infinity"]
    environment:
      <<: *db-env
    depends_on:
      mysql:
        condition: service_healthy

  swoole:
    build:
      context: .
      target: swoole
    volumes:
      - ..:/workspace
    working_dir: /workspace/demo
    command: ["sleep", "infinity"]
    environment:
      <<: *db-env
      SWOOLE_HOST: "0.0.0.0"
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: demo
      MYSQL_USER: demo
      MYSQL_PASSWORD: demo
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
