services:
  parallel:
    build:
      context: .
      target: parallel
    volumes:
      - ..:/workspace
    working_dir: /workspace/demo
    command: ["sleep", "infinity"]

  swoole:
    build:
      context: .
      target: swoole
    volumes:
      - ..:/workspace
    working_dir: /workspace/demo
    command: ["sleep", "infinity"]
    environment:
      SWOOLE_HOST: "0.0.0.0"
    ports:
      - "8080:8080"

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: demo
      MYSQL_USER: demo
      MYSQL_PASSWORD: demo
    ports:
      - "3306:3306"
    volumes:
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./sql/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
